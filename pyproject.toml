[build-system]
# 77: license als SPDX-Ausdruck mit license-files
# Babel: setup.py übersetzt die Kataloge beim Bauen
requires = ["setuptools>=77", "Babel==2.18.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mmit-cli-theme"
version = "0.2.0"
description = "Shared CLI theme for Python, Bash and Make: read the theme file, rich styles and spacing"
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE", "LICENSE.de.txt", "LICENSING.md"]
# 3.11 wie der erste Verbraucher agent-lessons
requires-python = ">=3.11"
dependencies = ["rich>=15"]

[project.urls]
Homepage = "https://github.com/MikeMitterer/python-clitheme"

[project.optional-dependencies]
# Entwicklung: Tests, Lint und Kataloge (make setup); setuptools baut im Test ein Wheel
dev = ["pytest", "ruff", "babel", "setuptools>=77"]

[project.scripts]
cli-theme = "cli_theme.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Die .mo kommen nur aus dem Bauschritt (setup.py), nie aus dem Quellbaum.
cli_theme = ["templates/*.theme", "locales/*/LC_MESSAGES/*.po"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
